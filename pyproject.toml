[project]
name = "graff"
version = "0.1.0"
description = "Graff — standalone-граф кода (символы + связи) с MCP-сервером"
authors = [{ name = "NEG", email = "egnovoselov@gmail.com" }]
license = { text = "BSL-1.1" }
requires-python = ">=3.9"
dependencies = [
    "tree-sitter==0.21.3",
    "tree-sitter-languages==1.10.2",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
graff = "graff.cli:main"
graff-server = "graff.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["graff", "graff.parsers"]
